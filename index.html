<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080b10">
  <title>Поток — доходы, расходы, цели</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💸</text></svg>">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="phone">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">₽</span>
        <span class="brand-name">Поток</span>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn account-btn" id="accountBtn" type="button" aria-label="Профиль">
          <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true">
            <circle cx="12" cy="8.4" r="3.4" fill="none" stroke="currentColor" stroke-width="1.8"/>
            <path d="M5.4 20c.5-3.4 3.1-5.4 6.6-5.4s6.1 2 6.6 5.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </button>
        <button class="icon-btn" id="menuBtn" aria-label="Меню" type="button">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <circle cx="5" cy="12" r="1.7" fill="currentColor"/>
            <circle cx="12" cy="12" r="1.7" fill="currentColor"/>
            <circle cx="19" cy="12" r="1.7" fill="currentColor"/>
          </svg>
        </button>
      </div>
    </header>

    <main class="view" id="view-home"></main>
    <main class="view" id="view-goal" hidden></main>
    <main class="view" id="view-forecast" hidden></main>
    <main class="view" id="view-waste" hidden></main>

    <button class="fab" id="fab" type="button" aria-label="Добавить операцию">
      <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">
        <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
      </svg>
    </button>

    <nav class="tabbar" aria-label="Разделы">
      <button class="tab is-active" data-tab="home" type="button">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4.6v-5.6H9.6V21H5a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
        </svg>
        <span>Главная</span>
      </button>
      <button class="tab" data-tab="goal" type="button">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.8"/>
          <circle cx="12" cy="12" r="3.4" fill="none" stroke="currentColor" stroke-width="1.8"/>
          <path d="M12 2v3M12 19v3M2 12h3M19 12h3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <span>Цели</span>
      </button>
      <button class="tab" data-tab="forecast" type="button">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <path d="M3 17l5.2-5.2 3.6 2.8L21 5.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M15.5 5.6H21v5.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M3 21h18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity=".45"/>
        </svg>
        <span>Прогноз</span>
      </button>
      <button class="tab" data-tab="waste" type="button">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <path d="M12 3.2s5.7 6.1 5.7 10.6a5.7 5.7 0 1 1-11.4 0C6.3 9.3 12 3.2 12 3.2z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          <path d="M9.6 14.4c0 1.3 1 2.3 2.3 2.3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
        <span>Утечки</span>
      </button>
    </nav>
  </div>

  <div class="modal-root" id="modalRoot"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
